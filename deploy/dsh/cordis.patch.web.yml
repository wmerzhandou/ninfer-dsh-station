# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# MiniMax Token Plan 接入：手工声明的 OpenAI 兼容路由（llm-pi-ai 适配器）
# 凭据通过环境变量 MINIMAX_API_KEY 按请求解析，密钥不写入本文件。
- id: llm-pi-ai
  config:
    providers:
      ninfer-local:
        displayName: Ninfer Qwen3.8-27B (本机 3090 via bili)
        apiKeyEnv: NINFER_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:18003/v1
        defaultInput:
          - text
          - image
        models:
          - id: qwen3.8-27b-ninfer
            name: Qwen3.8-27B NInfer Q4
            contextWindow: 245760
            maxTokens: 16384
            reasoningEfforts:
              low: low
              medium: medium
              high: xhigh

      ninfer-full:
        displayName: Ninfer FULL (3090 满血 249K/236tok/s)
        apiKeyEnv: NINFER_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8092/v1
        defaultInput:
          - text
          - image
        models:
          - id: qwen3.8-27b-full
            name: Qwen3.8-27B FULL 249K
            contextWindow: 245760
            maxTokens: 16384
            reasoningEfforts:
              low: low
              medium: medium
              high: xhigh

      minimax:
        displayName: MiniMax (Token Plan)
        apiKeyEnv: MINIMAX_API_KEY
        api: openai-completions
        baseURL: https://api.minimaxi.com/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: MiniMax-M3
            name: MiniMax M3
            contextWindow: 1048576
            maxTokens: 32768
            reasoningEfforts: false
      a3090:
        displayName: a3090
        api: openai-completions
        baseURL: http://192.168.1.100:8091/v1
        models:
          - id: qwen3.8-27b-ninfer
            name: qwen3.8-27b-ninfer
        apiKeyEnv: A3090_API_KEY

# 默认模型：本机 NInfer。改回 MiniMax 只需换成 provider: minimax / model: MiniMax-M3
- id: agent-default-model
  config:
    provider: ninfer-full
    model: qwen3.8-27b-full
    reasoningEffort: medium
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
